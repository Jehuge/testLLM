<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9eee6;color:#274746;font-family:system-ui,'Microsoft YaHei',sans-serif}.card{width:min(1080px,94vw);padding:28px 30px 20px;background:#fffdf3;border:1px solid #d7ded2;border-radius:24px;box-shadow:0 24px 70px #27474615}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:4px;color:#71928a}h1{font-size:clamp(22px,4vw,34px);font-weight:650;margin:7px 0}header span{font-size:13px;color:#78938c}.scene{border-radius:16px;overflow:hidden;background:#cce9e4}svg{display:block;width:100%;height:auto}footer{display:flex;justify-content:space-between;align-items:center;padding-top:18px;font-size:13px;color:#718a80}button{font:inherit;color:#365e54;border:1px solid #c7d5cb;background:#f4f6eb;padding:9px 17px;border-radius:30px;cursor:pointer}button:hover{background:#e6ede0}.paused *{animation-play-state:paused!important}@keyframes roll{to{transform:rotate(360deg)}}.spokes{animation:roll 1.6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes drift{to{transform:translateX(-1000px)}}.drift{animation:drift 12s linear infinite}.far{animation:drift 50s linear infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(-.6deg)}}.rider{animation:bob .8s ease-in-out infinite;transform-origin:490px 440px}@keyframes scarf{50%{d:path('M477 245 Q439 228 411 249 Q396 260 375 251 L381 264 Q408 281 432 259 Q449 252 478 255')}}.scarf{animation:scarf .8s ease-in-out infinite}@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}@media(max-width:600px){.card{padding:18px 14px}header span{display:none}footer{font-size:11px}}
</style>
</head>
<body><main class="card"><header><div><div class="eyebrow">A LITTLE COASTAL ADVENTURE</div><h1>鹈鹕的海岸骑行</h1></div><span>海风正好，慢慢骑。</span></header><div class="scene" id="scene">
<svg viewBox="0 0 1000 620" role="img" aria-label="一只戴着绿色帽子和橙色围巾的鹈鹕，在海边踩着蓝绿色自行车，车轮不断旋转">
<defs>

<linearGradient id="water" x2="0" y2="1"><stop stop-color="#8dcbc1"/><stop offset="1" stop-color="#b7dcd0"/></linearGradient>
<g id="cloud" fill="#fffdf1"><path d="M0 27 Q2 7 25 13 Q40 -12 61 10 Q83 -1 93 22 Q117 20 119 33 H0Z"/></g>
<g id="wheel"><circle r="77" fill="#fffdf0" fill-opacity=".2" stroke="#294c4b" stroke-width="11"/><circle r="69" fill="none" stroke="#faf7de" stroke-width="3"/><g class="spokes" stroke="#698b82" stroke-width="2"><path d="M-66 0H66 M0-66V66 M-47-47L47 47 M-47 47L47-47 M-61-25L61 25 M-25-61L25 61 M-61 25L61-25 M-25 61L25-61"/><circle cy="-58" r="4" fill="#f9cb6e" stroke="none"/></g><circle r="8" fill="#e9edd8" stroke="#294c4b" stroke-width="4"/></g>
<g id="grass" fill="none" stroke="#88a783" stroke-width="3" stroke-linecap="round"><path d="M0 0l-5-13M0 0l6-19M0 0l14-9"/></g>
</defs>
<path fill="url(#sky)" d="M0 0H1000V620H0Z"/><circle cx="796" cy="115" r="48" fill="#fff0af"/><circle cx="796" cy="115" r="65" fill="#fff0af" opacity=".15"/>
<g class="far" opacity=".8"><use href="#cloud" x="100" y="95"/><use href="#cloud" x="510" y="57"/><use href="#cloud" x="1050" y="95"/><use href="#cloud" x="1510" y="57"/></g>
<g fill="none" stroke="#60938b" stroke-width="3" stroke-linecap="round"><path d="M702 190q9-10 18 0q9-10 18 0M855 220q7-8 14 0q7-8 14 0"/></g>
<path d="M0 300 Q170 260 300 306 T640 290 T1000 310V415H0Z" fill="#9bc5b4"/><path d="M0 325Q140 290 270 330T530 319T850 318T1000 323V416H0Z" fill="#7fb3a6"/>
<path d="M0 352H1000V451H0Z" fill="url(#water)"/><g stroke="#e7f2db" stroke-width="3" opacity=".7"><path d="M30 378h140m130 15h180m120-22h130m87 37h150M10 428h100m180-7h90m160 9h160"/></g>
<path d="M0 446Q250 418 470 445T1000 442V620H0Z" fill="#e5dfb7"/><path d="M0 504H1000V581H0Z" fill="#b9c5b2"/><path d="M0 509H1000" stroke="#fff6d7" stroke-width="4"/>
<g class="drift"><g stroke="#f9f3d7" stroke-width="4" stroke-linecap="round"><path d="M0 550h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65m65 0h65"/></g><use href="#grass" x="105" y="480"/><use href="#grass" x="810" y="483"/><use href="#grass" x="1105" y="480"/><use href="#grass" x="1810" y="483"/><g fill="#b9b38a"><ellipse cx="260" cy="595" rx="9" ry="3"/><ellipse cx="860" cy="604" rx="6" ry="3"/><ellipse cx="1260" cy="595" rx="9" ry="3"/></g></g>
<ellipse cx="502" cy="525" rx="204" ry="13" fill="#5a7567" opacity=".15"/>
<use href="#wheel" x="355" y="442"/><use href="#wheel" x="650" y="442"/>
<!-- bicycle frame -->
<g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M355 442L429 341L491 442Z M429 341L610 339L491 442 M610 339L650 442" stroke="#2d7e7c" stroke-width="10"/><path d="M491 442L417 317M650 442L606 308L618 284L650 284" stroke="#355b59" stroke-width="7"/><path d="M392 319H437" stroke="#294b49" stroke-width="12"/><path d="M643 284H660" stroke="#cf8b56" stroke-width="9"/><path d="M614 293Q575 336 647 391" stroke="#526d64" stroke-width="2"/><path d="M298 403Q353 345 410 403M596 399Q648 350 703 403" stroke="#eaf0d5" stroke-width="6"/></g>
<!-- far leg -->
<path id="legFar" d="M438 321L480 363L470 443" fill="none" stroke="#be853d" stroke-width="12" stroke-linecap="round"/>
<path id="footFar" d="M459 443L483 443" fill="none" stroke="#be853d" stroke-width="11" stroke-linecap="round"/>
<g class="rider">
<!-- tail and rounded body -->
<path d="M400 301L359 286L367 314L350 307Q360 340 414 341" fill="#eceddc" stroke="#365853" stroke-width="3"/>
<path d="M401 274Q437 248 479 265Q506 292 489 321Q466 352 407 338Q375 324 382 300Z" fill="#fffef1" stroke="#365853" stroke-width="3"/>
<path d="M407 289Q443 273 463 297Q460 321 407 321Q387 307 407 289Z" fill="#e1e8d9"/><path d="M405 299q20 13 39 2m-40 11q17 12 32 4" fill="none" stroke="#afc4b4" stroke-width="3" stroke-linecap="round"/>
<!-- curved neck -->
<path d="M462 287Q456 258 469 223Q480 199 472 167Q468 137 493 135Q519 134 521 160Q525 185 508 216Q495 243 499 277" fill="#fffef1" stroke="#365853" stroke-width="3"/>
<!-- pouch and long bill -->
<path d="M508 168L643 180Q615 225 550 212Q520 204 508 184Z" fill="#efba67" stroke="#365853" stroke-width="3"/><path d="M505 163Q568 158 652 178Q656 183 646 187L509 181Z" fill="#f4ce80" stroke="#365853" stroke-width="3"/><path d="M524 182L629 183" stroke="#c58b4b" stroke-width="2"/><circle cx="504" cy="157" r="6" class="eye" fill="#284744"/><circle cx="506" cy="155" r="1.8" fill="#fff"/><ellipse cx="514" cy="174" rx="8" ry="4" fill="#efa07e" opacity=".6"/>
<!-- cap -->
<path d="M469 142Q467 110 492 108Q516 109 520 139Z" fill="#477b68" stroke="#365853" stroke-width="3"/><path d="M472 137Q508 133 538 142Q545 151 509 148L471 146Z" fill="#325e50" stroke="#365853" stroke-width="3"/><path d="M492 112L493 133" stroke="#82a088" stroke-width="2"/>
<!-- scarf -->
<path class="scarf" d="M477 245 Q439 258 411 243 Q396 232 375 244 L381 257 Q408 247 432 266 Q449 273 478 255" fill="#e98158" stroke="#bd6445" stroke-width="2"/><path d="M470 236L500 244L496 259L466 251Z" fill="#ef9562" stroke="#bd6445" stroke-width="2"/>
<!-- wing reaches handlebar -->
<path d="M456 285Q482 279 509 300Q541 313 586 289Q603 280 613 283Q617 290 605 295Q543 331 501 320Q474 315 456 302" fill="#fffef1" stroke="#365853" stroke-width="3" stroke-linejoin="round"/>
<path d="M491 304q14 7 26 7" fill="none" stroke="#b2c7b7" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- crank and near leg are driven together -->
<circle cx="491" cy="442" r="19" fill="#ecedda" stroke="#355b59" stroke-width="4"/><path id="crank" d="M470 442L512 442" stroke="#355b59" stroke-width="5"/>
<path id="legNear" d="M446 328L491 373L512 442" fill="none" stroke="#e3a64e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path id="footNear" d="M502 442L527 442" stroke="#e3a64e" stroke-width="11" stroke-linecap="round"/><path id="pedalNear" d="M502 448H524" stroke="#294c4b" stroke-width="5" stroke-linecap="round"/>
<g fill="none" stroke="#fffdf1" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M276 247h47M250 270h57M280 295h31"/></g>
<text x="38" y="48" fill="#517a70" font-family="monospace" font-size="12" letter-spacing="3">COASTLINE / 01</text>
</svg></div><footer><span>一只鹈鹕，一辆单车，一路好心情。</span><button id="toggle" type="button" aria-pressed="false">暂停动画</button></footer></main>
<script>
const scene=document.getElementById('scene'),button=document.getElementById('toggle');let paused=false,elapsed=0,last=null;
button.addEventListener('click',()=>{paused=!paused;scene.classList.toggle('paused',paused);button.textContent=paused?'继续骑行':'暂停动画';button.setAttribute('aria-pressed',String(paused));});
const ids=['legFar','footFar','crank','legNear','footNear','pedalNear'];const parts=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
function leg(hip,kneeTarget,foot){const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.hypot(dx,dy),a=66,b=76,along=(a*a-b*b+d*d)/(2*d),height=Math.sqrt(Math.max(0,a*a-along*along));return{x:hip.x+along*dx/d+height*dy/d,y:hip.y+along*dy/d-height*dx/d};}
function draw(t){const a=t/1600*Math.PI*2;const near={x:491+26*Math.cos(a),y:442+26*Math.sin(a)},far={x:491-26*Math.cos(a),y:442-26*Math.sin(a)};for(const [side,p,hip] of [['Near',near,{x:446,y:328}],['Far',far,{x:438,y:321}]]){const k=leg(hip,null,p);parts['leg'+side].setAttribute('d',`M${hip.x} ${hip.y}L${k.x} ${k.y}L${p.x} ${p.y}`);parts['foot'+side].setAttribute('d',`M${p.x-9} ${p.y}L${p.x+15} ${p.y}`);}parts.crank.setAttribute('d',`M${far.x} ${far.y}L${near.x} ${near.y}`);parts.pedalNear.setAttribute('d',`M${near.x-10} ${near.y+5}h22`);}
function frame(now){if(last!==null&&!paused)elapsed+=now-last;last=now;draw(elapsed);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
