<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2eb">
  <title>6.1-sol-不同思考等级鹈鹕测试</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #254844; background: #f3f2eb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1600px; margin: auto; padding: 64px 40px 32px; }
    .eyebrow { margin: 0 0 18px; color: #68847a; font-size: 12px; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(26px, 3.4vw, 48px); font-weight: 650; letter-spacing: -.04em; line-height: 1.3; }
    .subtitle { margin: 18px 0 28px; color: #657b72; font-size: clamp(15px, 1.7vw, 21px); line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 40px; }
    nav a { text-decoration: none; color: #315951; border: 1px solid #d2dcd2; border-radius: 99px; padding: 9px 17px; font-size: 13px; background: #fafaf4; }
    nav a:hover { background: #e1ebe1; }
    a:focus-visible { outline: 3px solid #cf7853; outline-offset: 4px; }
    .tests { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
    .test { min-width: 0; overflow: hidden; border: 1px solid #d9dfd3; border-radius: 22px; background: #fafaf5; scroll-margin-top: 24px; }
    .test-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 21px 24px; border-bottom: 1px solid #e0e4d9; }
    .test-heading { display: flex; align-items: center; gap: 12px; }
    .number { color: #849388; font-size: 12px; font-variant-numeric: tabular-nums; }
    h2 { margin: 0; font-size: 19px; font-weight: 600; }
    h2 span { margin-left: 8px; font-size: 12px; color: #6d8075; font-weight: 400; }
    .original { flex-shrink: 0; color: #688176; font-size: 12px; text-underline-offset: 4px; }
    iframe { display: block; border: 0; width: 100%; height: 570px; background: #f4f2e8; }
    .test:last-child { grid-column: 1 / -1; }
    .test:last-child iframe { height: 900px; }
    .note { margin: 28px 0 0; color: #7b8b7f; font-size: 12px; line-height: 1.8; text-align: center; }
    @media (max-width: 1000px) {
      main { padding: 40px 20px 24px; }
      .tests { grid-template-columns: 1fr; gap: 22px; }
      iframe, .test:last-child iframe { height: 740px; }
    }
    @media (max-width: 600px) {
      main { padding: 30px 12px 24px; }
      nav { margin-bottom: 26px; }
      nav a { padding: 8px 14px; }
      .test-header { padding: 18px 15px; }
      .test-heading { gap: 8px; }
      h2 { font-size: 17px; }
      h2 span { margin-left: 5px; font-size: 11px; }
      iframe, .test:last-child iframe { height: 510px; }
    }
  </style>
</head>

</html>
