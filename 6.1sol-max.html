<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e7">
  <title>海风正好 · 鹈鹕骑自行车</title>
  <style>
    :root { color-scheme: light; --paper:#f5f1e7; --ink:#29484a; --muted:#71817a; --accent:#d97758; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(1120px,calc(100% - 56px)); margin:44px auto 26px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:24px; }
    .eyebrow { margin:0 0 12px; font-size:11px; letter-spacing:.25em; font-weight:700; color:var(--muted); }
    h1 { margin:0; font-size:clamp(23px,3.6vw,38px); font-weight:650; letter-spacing:.04em; }
    .weather { display:flex; align-items:center; gap:9px; padding:9px 13px; border:1px solid #d6dcd0; border-radius:999px; font-size:12px; white-space:nowrap; }
    .weather i { width:7px; height:7px; border-radius:50%; background:#6e9d85; }
    .scene { position:relative; overflow:hidden; border:1px solid #d2d8c9; border-radius:20px; background:#f9f2dc; box-shadow:0 14px 42px #344a4310; }
    .scene > svg { display:block; width:100%; height:auto; }
    .scene-tag { position:absolute; top:22px; left:24px; display:flex; align-items:center; gap:8px; font-size:10px; font-weight:650; letter-spacing:.17em; color:#607973; }
    .scene-tag::before { content:""; width:20px; height:1px; background:currentColor; }
    .scene-caption { position:absolute; right:24px; bottom:19px; font-size:11px; letter-spacing:.15em; color:#7f8b74; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:22px 2px; }
    .actions { display:flex; align-items:center; gap:9px; }
    button { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 17px; border:1px solid #d7ddcf; border-radius:999px; background:transparent; color:var(--ink); font:inherit; font-size:12px; cursor:pointer; transition:background .18s,transform .18s; }
    button:hover { background:#eaeedc; }
    button:active { transform:translateY(1px); }
    button.primary { background:var(--ink); color:#fbf7e8; border-color:var(--ink); }
    button.primary:hover { background:#3b5c5b; }
    button svg { width:14px; height:14px; flex:none; }
    button:focus-visible,input:focus-visible { outline:3px solid #d9775870; outline-offset:4px; }
    .speed { display:flex; gap:13px; align-items:center; font-size:12px; color:#647771; }
    .speed output { min-width:37px; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
    input[type="range"] { appearance:none; width:135px; height:4px; border-radius:8px; background:#d3dacb; cursor:pointer; }
    input[type="range"]::-webkit-slider-thumb { appearance:none; width:13px; height:13px; border-radius:50%; background:var(--accent); border:2px solid var(--paper); box-shadow:0 0 0 1px var(--accent); }
    input[type="range"]::-moz-range-thumb { width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--paper); }
    footer { border-top:1px solid #dde0d3; display:flex; justify-content:space-between; padding-top:17px; color:#879184; font-size:11px; letter-spacing:.06em; }
    .outline { stroke:#29484a; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
    .detail { fill:none; stroke:#29484a; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    @media (max-width:600px) {
      main { width:calc(100% - 28px); margin:27px auto 20px; }
      header { margin-bottom:18px; gap:9px; }
      h1 { font-size:23px; }
      .eyebrow { font-size:9px; letter-spacing:.17em; margin-bottom:9px; }
      .weather { font-size:10px; padding:7px 9px; }
      .scene { border-radius:13px; }
      .scene-tag { top:13px; left:14px; font-size:8px; letter-spacing:.1em; }
      .scene-caption { right:14px; bottom:11px; font-size:8px; }
      .toolbar { gap:14px; flex-wrap:wrap; padding:17px 0; }
      .speed { gap:9px; }
      input[type="range"] { width:100px; }
      button { padding:0 12px; height:39px; }
      footer { font-size:9px; }
    }
    @media (max-width:390px) { .speed { width:100%; justify-content:flex-end; } }
  </style>
</head>

    <div class="toolbar">
      <div class="actions">
        <button id="toggle" class="primary" type="button" aria-label="暂停动画">
          <svg id="pause-icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx=".8"/><rect x="9" y="3" width="3" height="10" rx=".8"/></svg>
          <svg id="play-icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor" style="display:none"><path d="M4 2.5L13 8L4 13.5Z"/></svg>
          <span id="toggle-label">暂停</span>
        </button>
        <button id="restart" type="button" aria-label="从头开始动画">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6A5.3 5.3 0 1 1 3.1 11 M3 2.5V6H6.5"/></svg>
          重新出发
        </button>
      </div>
      <div class="speed">
        <label for="speed">踩踏速度</label>
        <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-valuetext="1.0 倍速">
        <output id="speed-value" for="speed">1.0×</output>
      </div>
    </div>
    <footer><span>白羽毛 · 小单车 · 好天气</span><span>把日子骑成海风。</span></footer>
    <noscript><p>请启用 JavaScript，让鹈鹕开始踩踏；静态插画仍可正常显示。</p></noscript>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const elements = {};
      [
        'rear-spokes','front-spokes','pelican','eye','crank','front-pedal','back-pedal',
        'front-leg-edge','front-leg-fill','back-leg-edge','back-leg-fill','front-foot','back-foot',
        'cloud-one','cloud-two','cloud-three','gull-wings','flying-gull','fish','breeze',
        'scarf-tail','scarf-stripe','bike-shadow',
        'far-a','far-b','water-a','water-b','sand-a','sand-b','road-a','road-b','foreground-a','foreground-b'
      ].forEach(id => { elements[id] = byId(id); });
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = byId('toggle');
      const speedInput = byId('speed');
      let playing = !reduceMotion.matches;
      let time = 0;
      let speed = Number(speedInput.value);
      let lastTime = null;
      let frameId = null;
      const setTransform = (id, value) => elements[id].setAttribute('transform', value);
      const wrap = (value, width) => ((value % width) + width) % width;

      function slideLayer(name, velocity) {
        const offset = wrap(time * velocity, 1200);
        setTransform(name + '-a', `translate(${-offset} 0)`);
        setTransform(name + '-b', `translate(${1200 - offset} 0)`);
      }

      // 二连杆逆运动学：固定髋部位置，脚踝跟随旋转中的踏板。
      function drawLeg(prefix, hipX, hipY, ankleX, ankleY) {
        const upper = 87, lower = 92;
        const dx = ankleX - hipX, dy = ankleY - hipY;
        const distance = Math.max(1, Math.min(Math.hypot(dx, dy), upper + lower - .01));
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + dx / distance * along + dy / distance * height;
        const kneeY = hipY + dy / distance * along - dx / distance * height;
        const path = `M${hipX} ${hipY}L${kneeX} ${kneeY}L${ankleX} ${ankleY}`;
        elements[prefix + '-leg-edge'].setAttribute('d', path);
        elements[prefix + '-leg-fill'].setAttribute('d', path);
        const tilt = Math.max(-13, Math.min(13, (ankleY - 576) * .32));
        setTransform(prefix + '-foot', `translate(${ankleX} ${ankleY - 3}) rotate(${tilt})`);
        elements[prefix + '-pedal'].setAttribute('d', `M${ankleX - 12} ${ankleY + 3}H${ankleX + 15}`);
      }

      function draw() {
        const phase = time * 3.7 + Math.PI / 2;
        const bob = Math.sin(phase * 2) * 2.1;
        const pedalX = 516 + Math.cos(phase) * 28;
        const pedalY = 576 + Math.sin(phase) * 28;
        const otherX = 1032 - pedalX;
        const otherY = 1152 - pedalY;
        const wheelAngle = time * 145 / 76 * 180 / Math.PI;
        setTransform('rear-spokes', `rotate(${wheelAngle % 360})`);
        setTransform('front-spokes', `rotate(${wheelAngle % 360})`);
        setTransform('pelican', `translate(0 ${bob})`);
        drawLeg('back', 473, 442 + bob, otherX, otherY);
        drawLeg('front', 486, 446 + bob, pedalX, pedalY);
        elements.crank.setAttribute('d', `M${otherX} ${otherY}L${pedalX} ${pedalY}`);
        elements['bike-shadow'].setAttribute('rx', 226 - bob * 1.4);

        slideLayer('far', 10);
        slideLayer('water', 23);
        slideLayer('sand', 75);
        slideLayer('road', 145);
        slideLayer('foreground', 185);
        const clouds = [['cloud-one', 196, 151, 1, 7], ['cloud-two', 506, 91, .66, 4], ['cloud-three', 1124, 249, 1.22, 9]];
        clouds.forEach(([id, x, y, scale, velocity]) => {
          const nextX = wrap(x + 190 - time * velocity, 1580) - 190;
          setTransform(id, `translate(${nextX} ${y}) scale(${scale})`);
        });

        const flutter = Math.sin(time * 2.2) * 6;
        elements['scarf-tail'].setAttribute('d', `M544 331C514 323 500 ${307 + flutter} 466 ${315 + flutter}L477 ${330 + flutter}L456 ${336 + flutter}Q499 ${350 + flutter} 544 345Z`);
        elements['scarf-stripe'].setAttribute('d', `M481 ${318 + flutter}Q503 ${325 + flutter * .5} 520 335`);
        const blinkTime = wrap(time, 5.6);
        const eyeScale = blinkTime > 4.95 && blinkTime < 5.16 ? .08 + .92 * Math.abs(blinkTime - 5.055) / .105 : 1;
        setTransform('eye', `translate(602 264) scale(1 ${eyeScale})`);
        setTransform('fish', `translate(0 ${Math.sin(time * 3.5) * 1.5})`);
        setTransform('breeze', `translate(${Math.sin(time * 1.4) * 7} 0)`);
        elements.breeze.setAttribute('opacity', .48 + Math.sin(time * 1.4) * .16);
        const wingHeight = 171 + Math.sin(time * 2.6) * 7;
        elements['gull-wings'].setAttribute('d', `M750 185Q766 ${wingHeight} 780 185Q794 ${wingHeight} 810 185`);
        setTransform('flying-gull', `translate(${-wrap(time * 13, 1420)} ${Math.sin(time * .7) * 8})`);
      }

      function updateButton() {
        byId('toggle-label').textContent = playing ? '暂停' : '继续骑行';
        byId('pause-icon').style.display = playing ? '' : 'none';
        byId('play-icon').style.display = playing ? 'none' : '';
        toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
      }

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) { lastTime = null; return; }
        if (lastTime !== null) time += Math.min((timestamp - lastTime) / 1000, .05) * speed;
        lastTime = timestamp;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(tick);
      }

      function setPlaying(value) {
        playing = value;
        lastTime = null;
        if (frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        updateButton();
        schedule();
      }

      toggle.addEventListener('click', () => setPlaying(!playing));
      byId('restart').addEventListener('click', () => { time = 0; lastTime = null; draw(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').value = speed.toFixed(1) + '×';
        speedInput.setAttribute('aria-valuetext', speed.toFixed(1) + ' 倍速');
      });
      document.addEventListener('visibilitychange', () => {
        lastTime = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });
      reduceMotion.addEventListener('change', event => { if (event.matches) setPlaying(false); });
      draw();
      updateButton();
      schedule();
    })();
  </script>
</body>
</html>
