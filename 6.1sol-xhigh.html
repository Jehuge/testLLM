<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>海风骑行 · 鹈鹕的小旅行</title>
  <style>
    :root { color-scheme: light; --paper:#f6f1e7; --ink:#243e40; --muted:#73827b; --teal:#247d78; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; -webkit-tap-highlight-color:transparent; }
    main { width:min(1180px,100%); margin:0 auto; padding:44px 36px 26px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:25px; }
    .eyebrow { margin:0 0 12px; color:var(--teal); font-size:10px; font-weight:750; letter-spacing:.23em; }
    h1 { font-size:clamp(23px,3.1vw,38px); font-weight:600; letter-spacing:.05em; margin:0; line-height:1.35; }
    .intro { margin:0 0 4px; font-size:12px; color:var(--muted); line-height:1.8; text-align:right; }
    .scene { position:relative; overflow:hidden; border:1px solid #dfdfce; border-radius:22px; background:#f8edda; box-shadow:0 16px 45px #2d514509; aspect-ratio:1280 / 760; }
    .scene svg { width:100%; height:100%; display:block; }
    .scene-label { position:absolute; top:24px; left:26px; display:flex; align-items:center; gap:9px; font-size:10px; font-weight:650; letter-spacing:.12em; color:#5a807b; }
    .scene-label i { height:6px; width:6px; border-radius:50%; background:#49938c; }
    .scene-label span { padding:5px 9px; border:1px solid #77a69d55; border-radius:20px; background:#fff9ed55; }
    .scene-note { position:absolute; right:24px; bottom:22px; font-size:10px; font-weight:650; letter-spacing:.17em; color:#947d62; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:20px 2px 0; }
    .play { display:flex; align-items:center; gap:9px; padding:10px 15px; color:var(--ink); background:transparent; border:1px solid #cbd3c7; border-radius:30px; cursor:pointer; font-size:12px; }
    .play svg { width:13px; height:13px; }
    .play:hover { background:#e9ecdf; }
    .speeds { display:flex; gap:4px; padding:4px; border:1px solid #e0e2d4; border-radius:30px; }
    .speeds button { border:0; border-radius:24px; color:#77857a; background:transparent; padding:7px 15px; font-size:12px; cursor:pointer; transition:background .2s,color .2s; }
    .speeds button[aria-pressed="true"] { background:var(--teal); color:#fffaf0; }
    button:focus-visible { outline:3px solid #e9a451; outline-offset:4px; }
    .caption { margin:0; color:#8b978b; font-size:11px; letter-spacing:.06em; }
    @media (max-width:700px) {
      main { padding:29px 18px 22px; }
      header { margin-bottom:20px; align-items:flex-start; }
      .intro { display:none; }
      .scene { border-radius:18px; aspect-ratio:1 / 1; }
      .scene-label { top:18px; left:18px; font-size:9px; }
      .scene-note { right:18px; bottom:18px; font-size:8px; }
      .caption { display:none; }
      .speeds button { padding:7px 11px; }
    }
  </style>
</head>

          <path d="M-9 -6 Q-24 -9 -26 -19 Q-12 -22 -9 -6 M10 -14 Q22 -22 26 -33 Q9 -30 10 -14 M17 -4 Q34 -6 38 -13 Q26 -17 17 -4" fill="#7b9c6c"/>
          <use href="#daisy" transform="translate(-20 -29) scale(.8)"/>
          <use href="#daisy" transform="translate(10 -40) scale(.9)"/>
          <use href="#daisy" transform="translate(31 -19) scale(.7)"/>
        </g>
        <path d="M799 449 L870 449 L858 492 Q835 498 811 490Z" fill="#d5a369" stroke="#8f714e" stroke-width="2.6"/>
        <path d="M804 459 H866 M807 470 H863 M809 481 H859 M816 451 L822 492 M829 451 L831 494 M842 451 L840 494 M856 451 L850 492" fill="none" stroke="#f1c48a" stroke-width="2.2"/>
        <path d="M800 449 H870" stroke="#a77d52" stroke-width="5"/>
        <path d="M805 445 H864" stroke="#efd1a0" stroke-width="2"/>
        <circle cx="757" cy="414" r="6" fill="#e6bd66" stroke="#8b7950" stroke-width="1.5"/>
      </g>
      <g id="speed-lines" fill="none" stroke="#899d83" stroke-width="2.5" stroke-linecap="round" opacity=".5">
        <path d="M369 400 H402 M346 422 H385 M361 443 H405"/>
      </g>
    </svg>
    <span class="scene-note" aria-hidden="true">NO RUSH, JUST RIDE.</span>
  </div>
  <div class="toolbar">
    <button class="play" id="play" type="button" aria-label="暂停动画" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path id="play-icon" d="M4 3H6V13H4ZM10 3H12V13H10Z"/></svg>
      <span id="play-text">暂停一下</span>
    </button>
    <p class="caption">沿着海岸，把烦恼留给风。</p>
    <div class="speeds" role="group" aria-label="骑行速度">
      <button type="button" data-speed="0.65" aria-pressed="false">悠闲</button>
      <button type="button" data-speed="1" aria-pressed="true">轻快</button>
      <button type="button" data-speed="1.5" aria-pressed="false">追风</button>
    </div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const el = id => document.getElementById(id);
  const refs = Object.fromEntries([
    'scene', 'rider', 'rider-shadow', 'rear-spokes', 'front-spokes', 'chainring',
    'far-leg', 'near-leg', 'near-leg-highlight', 'far-foot', 'near-foot',
    'far-crank', 'near-crank', 'far-pedal', 'near-pedal', 'clouds', 'waves',
    'shore', 'road', 'scarf-tail', 'flowers', 'sailboat', 'distant-birds',
    'speed-lines', 'sun-glitter', 'play', 'play-icon', 'play-text'
  ].map(id => [id, el(id)]));
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  let running = !motionPreference.matches;
  let userChosePlayback = false;
  let speed = 1;
  let elapsed = 0;
  let previous = null;
  let requestId = null;
  const crank = { x:640, y:597, r:24 };

  // 求解两段腿的关节位置，脚始终落在踏板上。
  function leg(hip, foot, upper, lower) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const distance = Math.hypot(dx, dy);
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const knee = {
      x:hip.x + dx / distance * along + dy / distance * height,
      y:hip.y + dy / distance * along - dx / distance * height
    };
    return 'M' + hip.x + ' ' + hip.y + ' L' + knee.x.toFixed(2) + ' ' + knee.y.toFixed(2) + ' L' + foot.x.toFixed(2) + ' ' + foot.y.toFixed(2);
  }

  function setPedal(side, phase, hip) {
    const foot = { x:crank.x + Math.cos(phase) * crank.r, y:crank.y + Math.sin(phase) * crank.r };
    const path = leg(hip, foot, 103, 103);
    refs[side + '-leg'].setAttribute('d', path);
    if (side === 'near') refs['near-leg-highlight'].setAttribute('d', path);
    refs[side + '-foot'].setAttribute('transform', 'translate(' + foot.x.toFixed(2) + ' ' + foot.y.toFixed(2) + ')');
    refs[side + '-crank'].setAttribute('d', 'M640 597 L' + foot.x.toFixed(2) + ' ' + foot.y.toFixed(2));
    refs[side + '-pedal'].setAttribute('d', 'M' + (foot.x - 11).toFixed(2) + ' ' + (foot.y + 8).toFixed(2) + ' h22');
  }

  function scroll(id, distance) {
    refs[id].setAttribute('transform', 'translate(' + (-(distance % 1280)).toFixed(2) + ' 0)');
  }

  function draw(t) {
    const phase = t * 2.6;
    const wheelDegrees = (t * 3.9 * 180 / Math.PI) % 360;
    const bob = Math.sin(phase * 2) * .8;
    refs.rider.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    refs['rear-spokes'].setAttribute('transform', 'rotate(' + wheelDegrees.toFixed(2) + ')');
    refs['front-spokes'].setAttribute('transform', 'rotate(' + wheelDegrees.toFixed(2) + ')');
    refs.chainring.setAttribute('transform', 'translate(640 597) rotate(' + (phase * 180 / Math.PI % 360).toFixed(2) + ')');
    setPedal('far', phase + Math.PI, {x:564, y:444});
    setPedal('near', phase, {x:588, y:444});
    // 路面移动距离匹配车轮周长，远景按更慢的速度移动。
    const travelled = t * 3.9 * 83;
    scroll('road', travelled);
    scroll('shore', travelled * .68);
    scroll('waves', travelled * .065);
    scroll('clouds', travelled * .025);
    const flutter = Math.sin(t * 5) * 5;
    refs['scarf-tail'].setAttribute('d', 'M655 353 Q620 ' + (334 + flutter) + ' 594 ' + (342 - flutter * .6) + ' Q568 ' + (350 + flutter) + ' 548 ' + (333 + flutter * 1.2) + ' L557 ' + (354 + flutter * 1.2) + ' Q587 ' + (372 - flutter * .6) + ' 618 ' + (356 + flutter) + ' Q638 350 655 363Z');
    refs.flowers.setAttribute('transform', 'translate(836 454) rotate(' + (Math.sin(t * 3.5) * 3).toFixed(2) + ')');
    refs.sailboat.setAttribute('transform', 'translate(' + (1137 - t * 6 % 1460).toFixed(2) + ' ' + (430 + Math.sin(t * 1.7) * 2).toFixed(2) + ')');
    refs['distant-birds'].setAttribute('transform', 'translate(' + (Math.sin(t * .32) * 22).toFixed(2) + ' ' + (Math.sin(t * 1.6) * 3).toFixed(2) + ')');
    refs['speed-lines'].setAttribute('opacity', (.2 + .2 * Math.sin(t * 5) ** 2).toFixed(2));
    refs['sun-glitter'].setAttribute('opacity', (.55 + .12 * Math.sin(t * 1.4)).toFixed(2));
    refs['rider-shadow'].setAttribute('rx', (239 + Math.sin(phase * 2) * 2).toFixed(2));
  }

  function frame(now) {
    requestId = null;
    if (!running || document.hidden) { previous = null; return; }
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .06) * speed;
    previous = now;
    draw(elapsed);
    requestId = requestAnimationFrame(frame);
  }

  function syncPlayback() {
    refs.play.setAttribute('aria-pressed', String(!running));
    refs.play.setAttribute('aria-label', running ? '暂停动画' : '播放动画');
    refs['play-text'].textContent = running ? '暂停一下' : '继续骑行';
    refs['play-icon'].setAttribute('d', running ? 'M4 3H6V13H4ZM10 3H12V13H10Z' : 'M4 2L13 8L4 14Z');
    previous = null;
    if (requestId !== null) { cancelAnimationFrame(requestId); requestId = null; }
    if (running && !document.hidden) requestId = requestAnimationFrame(frame);
  }

  refs.play.addEventListener('click', () => {
    userChosePlayback = true;
    running = !running;
    syncPlayback();
  });
  document.querySelectorAll('[data-speed]').forEach(button => {
    button.addEventListener('click', () => {
      speed = Number(button.dataset.speed);
      document.querySelectorAll('[data-speed]').forEach(option => {
        option.setAttribute('aria-pressed', String(option === button));
      });
    });
  });
  document.addEventListener('visibilitychange', syncPlayback);
  motionPreference.addEventListener('change', () => {
    if (!userChosePlayback) { running = !motionPreference.matches; syncPlayback(); }
  });
  const narrowScreen = window.matchMedia('(max-width:700px)');
  function resizeScene() {
    refs.scene.setAttribute('viewBox', narrowScreen.matches ? '295 60 670 670' : '0 0 1280 760');
  }
  narrowScreen.addEventListener('change', resizeScene);
  resizeScene();
  draw(0);
  syncPlayback();
})();
</script>
</body>
</html>
