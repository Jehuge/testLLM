<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4efe4;color:#254e55;font-family:system-ui,"PingFang SC",sans-serif;padding:24px}
main{width:min(1080px,100%)}header{display:flex;justify-content:space-between;align-items:end;margin:0 4px 20px;gap:15px}
.eyebrow{font-size:11px;letter-spacing:.28em;color:#648b87}h1{font-size:clamp(24px,4vw,40px);font-weight:600;letter-spacing:.05em;margin:8px 0 0}header p{font-size:13px;margin:0 0 4px;color:#6a8985}
.scene{border-radius:26px;overflow:hidden;box-shadow:0 22px 70px #436b5822;background:#dff1e9}svg{width:100%;display:block}
footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 4px;font-size:12px;color:#78908a}
button{border:1px solid #aac3b9;border-radius:30px;background:transparent;color:#365e57;padding:9px 19px;cursor:pointer;font:inherit}
button:hover{background:#e3ece3}button:focus-visible{outline:3px solid #d3935d;outline-offset:3px}
@media(max-width:600px){body{padding:14px}header p{display:none}footer{font-size:11px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">A LITTLE COASTAL ADVENTURE</div><h1>鹈鹕的海岸骑行</h1></div><p>海风刚好，慢慢向前。</p></header>
<div class="scene">
<svg id="scene" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">鹈鹕骑自行车的二维动画</title><desc id="desc">一只戴绿色帽子、系橙色围巾的白色鹈鹕，骑着珊瑚红色自行车沿海岸前行。</desc>
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dcefe9"/><stop offset="1" stop-color="#f8f5df"/></linearGradient>
<linearGradient id="sea" x2="0" y2="1"><stop stop-color="#91c9c0"/><stop offset="1" stop-color="#c2e0d1"/></linearGradient>
<pattern id="spokes" width="1" height="1" patternContentUnits="objectBoundingBox"><path d="M.5 0V1M0 .5H1M.146 .146L.854 .854M.146 .854L.854 .146" stroke="#91aaa1" stroke-width=".013"/></pattern>
<g id="cloud" fill="#fffdf3"><ellipse cx="0" cy="0" rx="47" ry="15"/><ellipse cx="-20" cy="-8" rx="23" ry="22"/><ellipse cx="14" cy="-15" rx="28" ry="27"/><ellipse cx="39" cy="-2" rx="24" ry="17"/></g>
<g id="grass" stroke="#799c7c" stroke-width="3" fill="none" stroke-linecap="round"><path d="M0 0l-5-13M0 0l7-18M0 0l14-8"/></g>
<g id="wheel"><circle r="72" fill="#fbf7e8" stroke="#284e51" stroke-width="10"/><circle r="64" fill="url(#spokes)" stroke="#d3ddd0" stroke-width="3"/><circle r="6" fill="#284e51"/><path d="M-12-61h24" stroke="#e3b56b" stroke-width="5" stroke-linecap="round"/></g>
</defs>
<path fill="url(#sky)" d="M0 0h1000v620H0z"/>
<circle cx="806" cy="109" r="48" fill="#f6d68d"/><circle cx="806" cy="109" r="64" fill="#f6d68d" opacity=".13"/>
<g id="clouds"><use href="#cloud" x="170" y="104"/><use href="#cloud" x="485" y="73" transform="translate(120 10) scale(.75)"/><use href="#cloud" x="1030" y="148"/></g>
<g fill="none" stroke="#719d95" stroke-width="3" stroke-linecap="round"><path d="M683 161q9-9 18 0q9-9 18 0"/><path d="M727 185q6-7 12 0q6-7 12 0"/></g>
<path d="M0 309q100-67 200-16t220-16t220 21t360-44v190H0" fill="#b5d0bb"/>
<path d="M0 332q100-18 230 5t300-8t470 1v171H0" fill="url(#sea)"/>
<g id="waves" fill="none" stroke="#eef5dc" stroke-width="3" stroke-linecap="round" opacity=".7"><path d="M30 361h93m60 28h80m120-38h110m75 49h150m76-45h94M10 430h110m112-14h74m475 8h101"/></g>
<path d="M0 455q210-24 420-4t580-12v181H0" fill="#e8d8ac"/>
<path d="M0 489q240-18 500 0t500-1v65H0" fill="#f7edd3"/>
<path d="M0 554h1000v66H0" fill="#aac294"/>
<g id="roadmarks" stroke="#ddc99e" stroke-width="4" stroke-linecap="round"><path d="M-200 526h70M0 526h70M200 526h70M400 526h70M600 526h70M800 526h70M1000 526h70M1200 526h70"/></g>
<g id="plants"><use href="#grass" x="80" y="582"/><use href="#grass" x="270" y="604"/><use href="#grass" x="705" y="580"/><use href="#grass" x="932" y="602"/><use href="#grass" x="1080" y="582"/><use href="#grass" x="1270" y="604"/><use href="#grass" x="1705" y="580"/><use href="#grass" x="1932" y="602"/>
<g fill="#fff8dd"><circle cx="210" cy="574" r="4"/><circle cx="670" cy="608" r="4"/><circle cx="965" cy="571" r="4"/></g></g>
<ellipse cx="500" cy="513" rx="214" ry="13" fill="#788b69" opacity=".17"/>
<g id="rider">
<!-- Far leg is behind the bicycle frame. -->
<path id="farLeg" d="" fill="none" stroke="#d79549" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(349 434)"><g id="rearWheel"><use href="#wheel"/></g></g>
<g transform="translate(646 434)"><g id="frontWheel"><use href="#wheel"/></g></g>
<g stroke="#cc6854" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round">
<path d="M349 434L427 319L495 434H349L591 319L495 434M427 319H591M591 319L646 434"/>
<path d="M427 319l-10-28M591 319l-14-54"/>
</g>
<path d="M395 291h43" stroke="#284e51" stroke-width="12" stroke-linecap="round"/>
<path d="M577 265l26-9h21q13 0 13 12" fill="none" stroke="#284e51" stroke-width="7" stroke-linecap="round"/>
<circle cx="617" cy="253" r="7" fill="#e6bc72" stroke="#284e51" stroke-width="2"/>
<path d="M357 433l136 1" stroke="#74958a" stroke-width="3"/>
<circle cx="495" cy="434" r="19" fill="#f7edd3" stroke="#284e51" stroke-width="4"/>
<g id="crank"><path d="M-27 0h54" stroke="#284e51" stroke-width="5" stroke-linecap="round"/></g>
<!-- Pelican: broad body, curved neck, long bill and throat pouch. -->
<g id="bird">
<path d="M383 277l-41-13 30 36" fill="#edead7" stroke="#34575a" stroke-width="3" stroke-linejoin="round"/>
<path d="M379 266C364 232 379 207 413 207C445 203 479 230 491 263C481 288 445 300 409 289Z" fill="#fffdf2" stroke="#34575a" stroke-width="3"/>
<path d="M418 224q-33 2-26 35q23 17 49 5q-20-7-23-40" fill="#e1e8dc" stroke="#78938a" stroke-width="2"/>
<path d="M455 242C481 226 474 201 474 176C470 148 485 122 507 125C535 123 544 147 532 168C517 187 513 207 522 229L538 253C516 270 481 271 455 242" fill="#fffdf2" stroke="#34575a" stroke-width="3"/>
<path d="M530 154L677 170Q640 202 557 191Q534 184 530 154" fill="#eeb95e" stroke="#34575a" stroke-width="3" stroke-linejoin="round"/>
<path d="M531 153L688 164Q696 168 683 172L532 167" fill="#f5d38b" stroke="#34575a" stroke-width="3" stroke-linejoin="round"/>
<path d="M548 176q33 13 70 4" stroke="#d69947" stroke-width="2" fill="none"/>
<circle cx="517" cy="149" r="6" fill="#284e51"/><circle cx="519" cy="147" r="1.8" fill="white"/>
<path d="M489 127q-1-31 28-33q29 0 28 32" fill="#477c68" stroke="#34575a" stroke-width="3"/>
<path d="M482 128q30-7 73 1" fill="none" stroke="#34575a" stroke-width="7" stroke-linecap="round"/>
<path d="M494 109q15-9 30-3" stroke="#7cab86" stroke-width="4" fill="none"/>
<path id="scarfTail" d="M483 207Q452 215 421 189L431 208L415 215Q455 237 493 223" fill="#d97b58" stroke="#a75c45" stroke-width="2"/>
<path d="M474 206q20 12 44 1l4 15q-30 9-49-2Z" fill="#e98e63" stroke="#a75c45" stroke-width="2"/>
<path d="M459 232q46 39 119 35l29-8" fill="none" stroke="#34575a" stroke-width="20" stroke-linecap="round"/>
<path d="M459 230q46 39 119 35l29-8" fill="none" stroke="#f4f1df" stroke-width="15" stroke-linecap="round"/>
<path d="M598 260l13-4" stroke="#e2a653" stroke-width="9" stroke-linecap="round"/>
</g>
<path id="nearLeg" d="" fill="none" stroke="#e3a551" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path id="farFoot" stroke="#c88943" stroke-width="10" stroke-linecap="round"/>
<path id="nearFoot" stroke="#efb757" stroke-width="11" stroke-linecap="round"/>
</g>
<g fill="#456e62" font-family="system-ui,sans-serif" font-size="11" letter-spacing="3"><text x="40" y="42">COASTAL CYCLING CLUB</text></g>
</svg>
</div>
<footer><span>SVG 手绘动画 · 把日子骑成一阵海风</span><button id="toggle" aria-pressed="false">暂停动画</button></footer>
</main>
<script>
(() => {
const $=id=>document.getElementById(id);
let running=true,clock=0,last=null;
const hip={x:434,y:283},center={x:495,y:434},radius=29;
function leg(angle,legId,footId,front){
 const foot={x:center.x+radius*Math.cos(angle),y:center.y+radius*Math.sin(angle)};
 const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.hypot(dx,dy);
 const upper=104,lower=91;
 const a=(upper*upper-lower*lower+d*d)/(2*d);
 const h=Math.sqrt(Math.max(0,upper*upper-a*a));
 const knee={x:hip.x+a*dx/d+h*dy/d,y:hip.y+a*dy/d-h*dx/d};
 $(legId).setAttribute('d','M'+hip.x+' '+hip.y+'L'+knee.x+' '+knee.y+'L'+foot.x+' '+foot.y);
 $(footId).setAttribute('d','M'+(foot.x-9)+' '+(foot.y+2)+'l24 0');
}
function draw(){
 const angle=clock*2*Math.PI/1.5;
 const degrees=angle*180/Math.PI;
 $('rearWheel').setAttribute('transform','rotate('+degrees+')');
 $('frontWheel').setAttribute('transform','rotate('+degrees+')');
 $('crank').setAttribute('transform','translate(495 434) rotate('+degrees+')');
 leg(angle+Math.PI,'farLeg','farFoot',false);
 leg(angle,'nearLeg','nearFoot',true);
 $('rider').setAttribute('transform','translate(0 '+Math.sin(angle*2)*1.3+')');
 $('bird').setAttribute('transform','rotate('+Math.sin(angle)*.7+' 434 283)');
 $('scarfTail').setAttribute('transform','rotate('+Math.sin(clock*8)*4+' 485 213)');
 $('roadmarks').setAttribute('transform','translate('+(-clock*100%200)+' 0)');
 $('plants').setAttribute('transform','translate('+(-clock*100%1000)+' 0)');
 $('clouds').setAttribute('transform','translate('+(-clock*7%1100)+' 0)');
 $('waves').setAttribute('transform','translate('+Math.sin(clock*.6)*14+' 0)');
}
function frame(now){
 if(last!==null&&running) clock+=Math.min((now-last)/1000,.05);
 last=now;draw();requestAnimationFrame(frame);
}
$('toggle').addEventListener('click',()=>{
 running=!running;
 $('toggle').textContent=running?'暂停动画':'继续动画';
 $('toggle').setAttribute('aria-pressed',String(!running));
});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){running=false;$('toggle').textContent='播放动画';$('toggle').setAttribute('aria-pressed','true');}
draw();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
